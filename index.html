<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Только для Саши ❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-family: 'Comic Sans MS', cursive;
    transition: background-image 1s ease-in-out;
    background-size: cover;
    background-position: center;
}

.overlay {
    background: rgba(255,255,255,0.85);
    padding: 30px;
    border-radius: 25px;
    text-align: center;
    animation: fadeIn 1s ease;
}

h1 {
    color: #ff2e63;
    animation: slideIn 0.8s ease;
}

button {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 10px;
    transition: 0.3s;
}

.correct {
    background-color: #ff2e63;
    color: white;
}

.wrong {
    background-color: white;
    color: #ff2e63;
    position: relative;
}

button:hover {
    transform: scale(1.15);
}

@keyframes fadeIn {
    from {opacity:0;}
    to {opacity:1;}
}

@keyframes slideIn {
    from {transform: translateY(-20px); opacity:0;}
    to {transform: translateY(0); opacity:1;}
}

.heart {
    position: fixed;
    color: red;
    animation: float 4s linear infinite;
}

@keyframes float {
    0% { transform: translateY(0); opacity: 1;}
    100% { transform: translateY(-100vh); opacity: 0;}
}

#game {
    display: none;
}
</style>
</head>

<body>

<div id="startScreen" class="overlay">
    <h1>Если ты не мой Саша — уходи 😏</h1>
    <button onclick="startGame()">Это я, твой Саша ❤️</button>
</div>

<div id="game" class="overlay">
    <h1 id="question"></h1>
    <div id="buttons"></div>
</div>

<script>

// 🔥 ЗДЕСЬ ТЫ МОЖЕШЬ МЕНЯТЬ ФОНЫ
const backgrounds = [
"https://images.unsplash.com/photo-1507525428034-b723cf961d3e",
"https://images.unsplash.com/photo-1492724441997-5dc865305da7",
"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee",
"https://images.unsplash.com/photo-1470770841072-f978cf4d019e",
"https://images.unsplash.com/photo-1501785888041-af3ef285b470"
];

const funnyPhrases = [
"НЕПРАВИЛЬНО 😂",
"Так не работает 😏",
"Попробуй ещё раз 😜",
"Я всё равно знаю ответ 😌",
"Ты ошибся 😁",
"Нееееет 😆",
"Ну Нееееет 😆",
"Может хватит шутить😏",
"Перестань 😌",
"Только попробуй 🥺",
"Ну все,я обиделась 🥺"   
];

const questions = [
{ text: "Ты меня любишь? ❤️", answers: ["Безумно ❤️", "Нет"] },
{ text: "Ты скучаешь по мне? 🥺", answers: ["Каждую секунду 💕", "Нет"] },
{ text: "Пойдёшь со мной на свидание? 💋", answers: ["Конечно 😍", "Нет"] },
{ text: "Будем смотреть фильм вместе? 🍿", answers: ["Дааа ❤️", "Нет"] },
{ text: "Будешь меня обнимать? 🤗", answers: ["Всегда 💖", "Нет"] },
{ text: "Я самая лучшая? 😏", answers: ["Естественно 😌", "Нет"] },
{ text: "Будешь носить меня на ручках? 😆", answers: ["Да, моя принцесса 👑", "Нет"] },
{ text: "Любишь мои глупости? 😂", answers: ["Обожаю 😁", "Нет"] },
{ text: "Будешь терпеть меня, когда я вредничаю? 😅", answers: ["С удовольствием 💕", "Нет"] },
{ text: "Ты счастлив со мной? 🥰", answers: ["Самый счастливый ❤️", "Нет"] }
];

let currentQuestion = 0;
const questionEl = document.getElementById("question");
const buttonsEl = document.getElementById("buttons");

function startGame() {
    document.getElementById("startScreen").style.display = "none";
    document.getElementById("game").style.display = "block";
    changeBackground();
    showQuestion();
}

function changeBackground() {
    const bg = backgrounds[currentQuestion % backgrounds.length];
    document.body.style.backgroundImage = `url('${bg}')`;
}

function showQuestion() {
    buttonsEl.innerHTML = "";
    questionEl.style.animation = "none";
    void questionEl.offsetWidth;
    questionEl.style.animation = "slideIn 0.8s ease";
    questionEl.innerText = questions[currentQuestion].text;

    questions[currentQuestion].answers.forEach((answer, index) => {
        const btn = document.createElement("button");
        btn.innerText = answer;

        if (index === 0) {
            btn.classList.add("correct");
            btn.onclick = nextQuestion;
        } else {
            btn.classList.add("wrong");
            btn.onmouseover = () => {
                const x = Math.random() * (window.innerWidth - 150);
                const y = Math.random() * (window.innerHeight - 50);
                btn.style.position = "absolute";
                btn.style.left = x + "px";
                btn.style.top = y + "px";
                btn.innerText = funnyPhrases[Math.floor(Math.random() * funnyPhrases.length)];
            };
        }

        buttonsEl.appendChild(btn);
    });
}

function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < questions.length) {
        changeBackground();
        showQuestion();
    } else {
        showFinal();
    }
}

function showFinal() {
    questionEl.innerHTML = "Ты прошёл тест 😍❤️<br>Теперь ты обязан поцеловать меня 💋";
    buttonsEl.innerHTML = "";
    createHearts();
}

function createHearts() {
    for (let i = 0; i < 120; i++) {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (Math.random() * 30 + 15) + "px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 4000);
    }
}

</script>

</body>
</html>
