<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Только для Саши ❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-family: 'Comic Sans MS', cursive;

    background-size: contain;       /* Показываем всю GIF полностью */
    background-position: center;
    background-repeat: no-repeat;
    transition: background 0.8s ease-in-out;
}

/* затемнение для читаемости текста */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.35);
    pointer-events: none;
    z-index: 0;
}

.overlay {
    background: rgba(255,255,255,0.9);
    padding: 35px;
    border-radius: 25px;
    text-align: center;
    animation: fadeIn 1s ease;
    box-shadow: 0 0 30px rgba(0,0,0,0.2);
    z-index: 1;
}

h1 {
    color: #ff2e63;
    animation: slideIn 0.8s ease;
}

button {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 10px;
    transition: 0.3s;
}

.correct {
    background-color: #ff2e63;
    color: white;
}

.wrong {
    background-color: white;
    color: #ff2e63;
    position: relative;
}

button:hover {
    transform: scale(1.15);
}

@keyframes fadeIn {
    from {opacity:0;}
    to {opacity:1;}
}

@keyframes slideIn {
    from {transform: translateY(-20px); opacity:0;}
    to {transform: translateY(0); opacity:1;}
}

.heart, .star {
    position: fixed;
    animation: float 4s linear infinite;
    z-index: 2;
}

@keyframes float {
    0% { transform: translateY(0); opacity: 1;}
    100% { transform: translateY(-100vh); opacity: 0;}
}

#game {
    display: none;
}

.final-text {
    color: #ff2e63;
    font-size: 36px;
    font-weight: bold;
    text-shadow: 0 0 20px #fff;
    animation: pop 1s ease forwards;
    opacity: 0;
}

@keyframes pop {
    0% { transform: scale(0.5); opacity: 0; }
    60% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
}
</style>
</head>

<body>

<div id="startScreen" class="overlay">
    <h1>Если ты не мой Саша — уходи 😏</h1>
    <button onclick="startGame()">Это я, твой Саша ❤️</button>
</div>

<div id="game" class="overlay">
    <h1 id="question"></h1>
    <div id="buttons"></div>
</div>

<script>
// GIF для каждого вопроса
const backgrounds = [
"https://i.yapx.ru/Grj9g.gif",                     
"https://webstockreview.net/images/clipart-cat-animated-gif-8.gif", 
"https://i.pinimg.com/originals/b4/ab/26/b4ab265b85e6967f2059d0ca14646fd6.gif", 
"https://media.tenor.com/dStJVtPNiTUAAAAC/adventuretime-jake.gif",  
"https://media1.tenor.com/m/XXp0jOxwfD8AAAAC/jake-scream.gif",      
"https://i.gifer.com/7efs.gif", 
"https://i.gifer.com/VAyR.gif", 
"https://i.gifer.com/ZZ5H.gif", 
"https://i.gifer.com/2iiJ.gif", 
"https://i.gifer.com/6ob.gif",  
"https://media.tenor.com/1snEvE1Gv-IAAAAC/bailar-jake.gif",
"https://media1.tenor.com/images/be3be2f37708b90e41357c79d395dea8/tenor.gif?itemid=4893306",
"https://c.tenor.com/7cAOc2fKOcEAAAAM/adventure-time.gif"
];

const funnyPhrases = [
"НЕПРАВИЛЬНО 😂",
"Так не работает 😏",
"Попробуй ещё раз 😜",
"Я всё равно знаю ответ 😌",
"Ты ошибся 😁",
"Нееееет 😆",
"Ну Нееееет 😆",
"Может хватит шутить😏",
"Перестань 😌",
"Только попробуй 🥺",
"Ну все,я обиделась 🥺"   
];

const questions = [
{ text: "Ты меня любишь? ❤️", answers: ["Безумно ❤️", "Нет"] },
{ text: "Ты скучаешь по мне? 🥺", answers: ["Каждую секунду 💕", "Нет"] },
{ text: "Пойдёшь со мной на свидание? 💋", answers: ["Конечно 😍", "Нет"] },
{ text: "Будем смотреть фильм вместе? 🍿", answers: ["Дааа ❤️", "Нет"] },
{ text: "Будешь меня обнимать? 🤗", answers: ["Всегда 💖", "Нет"] },
{ text: "Я самая лучшая? 😏", answers: ["Естественно 😌", "Нет"] },
{ text: "Будешь носить меня на ручках? 😆", answers: ["Да, принцесса 👑", "Нет"] },
{ text: "Любишь мои глупости? 😂", answers: ["Обожаю 😁", "Нет"] },
{ text: "Будешь терпеть меня, когда я вредничаю? 😅", answers: ["С удовольствием 💕", "Нет"] },
{ text: "Ты счастлив со мной? 🥰", answers: ["Самый счастливый ❤️", "Нет"] }
];

let currentQuestion = 0;
const questionEl = document.getElementById("question");
const buttonsEl = document.getElementById("buttons");

function changeBackground() {
    document.body.style.background = 
        `url("${backgrounds[currentQuestion]}") center/contain no-repeat fixed`;
}

function startGame() {
    document.getElementById("startScreen").style.display = "none";
    document.getElementById("game").style.display = "block";
    changeBackground();
    showQuestion();
}

function showQuestion() {
    buttonsEl.innerHTML = "";
    questionEl.style.animation = "none";
    void questionEl.offsetWidth;
    questionEl.style.animation = "slideIn 0.8s ease";
    questionEl.innerText = questions[currentQuestion].text;

    questions[currentQuestion].answers.forEach((answer, index) => {
        const btn = document.createElement("button");
        btn.innerText = answer;

        if (index === 0) {
            btn.classList.add("correct");
            btn.onclick = nextQuestion;
        } else {
            btn.classList.add("wrong");
            btn.onmouseover = () => {
                const x = Math.random() * (window.innerWidth - 150);
                const y = Math.random() * (window.innerHeight - 50);
                btn.style.position = "absolute";
                btn.style.left = x + "px";
                btn.style.top = y + "px";
                btn.innerText = funnyPhrases[Math.floor(Math.random() * funnyPhrases.length)];
            };
        }

        buttonsEl.appendChild(btn);
    });
}

function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < questions.length) {
        changeBackground();
        showQuestion();
    } else {
        showFinal();
    }
}

// 💖 Финал с эффектом вау
function showFinal() {
    questionEl.innerHTML = "";
    buttonsEl.innerHTML = "";

    const finalText = document.createElement("div");
    finalText.classList.add("final-text");
    finalText.innerHTML = "Ты прошёл тест 😍❤️<br>Теперь ты обязан поцеловать меня 💋";
    document.getElementById("game").appendChild(finalText);

    // Создаём множество сердец
    for (let i = 0; i < 150; i++) {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (Math.random() * 25 + 15) + "px";
        heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 5000);
    }
}
</script>

</body>
</html>
